name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # --with-deps also installs extra fonts through apt. When the Ubuntu mirror cannot be reached, the runner's
      # preinstalled libraries are enough, so install the browser alone instead of failing the run.
      - name: Install Chromium for the fixture tests
        run: npx playwright install --with-deps chromium || npx playwright install chromium

      # Unit tests for audit.js, the fixture pages in Chromium, adapters in step with SKILL.md,
      # and the numbers the READMEs, manifests and CHANGELOG state.
      - name: Test
        run: npm run test:ci
