name: Tool compatibility
description: The skill does not install, load or trigger in an agent or editor
labels: [compatibility]
body:
  - type: input
    id: tool
    attributes:
      label: Tool and version
      description: For example Claude Code 2.x, Codex CLI, Cursor, Antigravity, Copilot, Kiro.
    validations:
      required: true
  - type: input
    id: channel
    attributes:
      label: Install channel
      description: npx skills add, plugin marketplace, manual copy (which folder), adapter snippet…
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command, the prompt you used and what the agent did.
    validations:
      required: true
