<header class="page-head">

    <h1>Đơn nghỉ phép</h1>
    <p class="sub" id="summary">Duyệt và theo dõi đơn nghỉ của nhân viên.</p>

<section class="card" aria-label="Danh sách đơn nghỉ phép">
  <div class="tabs chips" id="tabs" role="group" aria-label="Lọc theo trạng thái"></div>
  <div class="toolbar">
    <input type="search" id="q" placeholder="Tìm theo tên nhân viên…" aria-label="Tìm theo tên nhân viên">
  </div>
  <div class="chips" id="fchips" hidden></div>
  <div class="table-wrap">
  <table data-total-rows="36" aria-busy="true">
    <thead><tr><th>Mã đơn</th><th>Nhân viên</th><th>Loại nghỉ</th><th>Lý do</th><th>Từ ngày</th><th>Đến ngày</th><th class="num">Số ngày</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  </div>
  <div class="state" id="empty" hidden></div>
  <div class="pager"><span id="range" role="status"></span><button type="button" class="btn secondary load-more" id="more">Xem thêm</button></div>
</section>
</main>
<script src="app.js"></script>
<script>
const DATA = [{"code":"NP-1001","name":"Nguyễn Văn An","dept":"Nhân sự","type":"Nghỉ phép năm","from":"Oct 26","to":"Oct 26","days":1,"reason":"Việc gia đình","status":"Chờ duyệt"},{"code":"NP-1002","name":"Hồ Hoài Cường","dept":"Kế toán","type":"Nghỉ ốm","from":"Oct 28","to":"Oct 29","days":2,"reason":"Khám sức khỏe","status":"Từ chối"},{"code":"NP-1003","name":"Đỗ Minh Hà","dept":"Hành chính","type":"Nghỉ không lương","from":"Oct 30","to":"Nov 1","days":3,"reason":"Về quê","status":"Đã hủy"},{"code":"NP-1004","name":"Bùi Đức Hương","dept":"Sản xuất","type":"Nghỉ việc riêng","from":"Nov 1","to":"Nov 4","days":4,"reason":"Đi du lịch","status":"Chờ duyệt"},{"code":"NP-1005","name":"Đặng Thu Lan","dept":"Mua hàng","type":"Nghỉ thai sản","from":"Nov 3","to":"Nov 3","days":1,"reason":"Chăm con ốm","status":"Chờ duyệt"},{"code":"NP-1006","name":"Vũ Thị Long","dept":"Pháp chế","type":"Nghỉ phép năm","from":"Nov 5","to":"Nov 6","days":2,"reason":"Làm thủ tục giấy tờ","status":"Chờ duyệt"},{"code":"NP-1007","name":"Phan Ngọc Nam","dept":"Kho vận","type":"Nghỉ ốm","from":"Nov 7","to":"Nov 9","days":3,"reason":"Việc gia đình","status":"Đã duyệt"},{"code":"NP-1008","name":"Huỳnh Quốc Lan","dept":"Chăm sóc khách hàng","type":"Nghỉ không lương","from":"Nov 9","to":"Nov 12","days":4,"reason":"Khám sức khỏe","status":"Đã duyệt"},{"code":"NP-1009","name":"Hoàng Văn Long","dept":"Vận hành","type":"Nghỉ việc riêng","from":"Nov 11","to":"Nov 11","days":1,"reason":"Về quê","status":"Đã duyệt"},{"code":"NP-1010","name":"Phạm Hoài Mai","dept":"Kỹ thuật","type":"Nghỉ thai sản","from":"Nov 13","to":"Nov 14","days":2,"reason":"Đi du lịch","status":"Từ chối"},{"code":"NP-1011","name":"Lê Minh Phúc","dept":"Marketing","type":"Nghỉ phép năm","from":"Nov 15","to":"Nov 17","days":3,"reason":"Chăm con ốm","status":"Đã hủy"},{"code":"NP-1012","name":"Trần Đức Sơn","dept":"Kinh doanh","type":"Nghỉ ốm","from":"Nov 17","to":"Nov 20","days":4,"reason":"Làm thủ tục giấy tờ","status":"Chờ duyệt"},{"code":"NP-1013","name":"Nguyễn Thu Tuấn","dept":"Nhân sự","type":"Nghỉ không lương","from":"Nov 19","to":"Nov 19","days":1,"reason":"Việc gia đình","status":"Chờ duyệt"},{"code":"NP-1014","name":"Hồ Thị Yến","dept":"Kế toán","type":"Nghỉ việc riêng","from":"Nov 21","to":"Nov 22","days":2,"reason":"Khám sức khỏe","status":"Chờ duyệt"},{"code":"NP-1015","name":"Đỗ Ngọc Sơn","dept":"Hành chính","type":"Nghỉ thai sản","from":"Nov 23","to":"Nov 25","days":3,"reason":"Về quê","status":"Đã duyệt"},{"code":"NP-1016","name":"Bùi Quốc Tuấn","dept":"Sản xuất","type":"Nghỉ phép năm","from":"Nov 25","to":"Nov 28","days":4,"reason":"Đi du lịch","status":"Đã duyệt"},{"code":"NP-1017","name":"Đặng Văn Yến","dept":"Mua hàng","type":"Nghỉ ốm","from":"Nov 27","to":"Nov 27","days":1,"reason":"Chăm con ốm","status":"Đã duyệt"},{"code":"NP-1018","name":"Vũ Hoài Hạnh","dept":"Pháp chế","type":"Nghỉ không lương","from":"Nov 29","to":"Nov 30","days":2,"reason":"Làm thủ tục giấy tờ","status":"Từ chối"},{"code":"NP-1019","name":"Phan Minh Trang","dept":"Kho vận","type":"Nghỉ việc riêng","from":"Dec 1","to":"Dec 3","days":3,"reason":"Việc gia đình","status":"Đã hủy"},{"code":"NP-1020","name":"Huỳnh Đức Loan","dept":"Chăm sóc khách hàng","type":"Nghỉ thai sản","from":"Dec 3","to":"Dec 6","days":4,"reason":"Khám sức khỏe","status":"Chờ duyệt"},{"code":"NP-1021","name":"Hoàng Thu Cường","dept":"Vận hành","type":"Nghỉ phép năm","from":"Dec 5","to":"Dec 5","days":1,"reason":"Về quê","status":"Chờ duyệt"},{"code":"NP-1022","name":"Phạm Thị Trang","dept":"Kỹ thuật","type":"Nghỉ ốm","from":"Dec 7","to":"Dec 8","days":2,"reason":"Đi du lịch","status":"Chờ duyệt"},{"code":"NP-1023","name":"Lê Ngọc Loan","dept":"Marketing","type":"Nghỉ không lương","from":"Dec 9","to":"Dec 11","days":3,"reason":"Chăm con ốm","status":"Đã duyệt"},{"code":"NP-1024","name":"Trần Quốc Cường","dept":"Kinh doanh","type":"Nghỉ việc riêng","from":"Dec 11","to":"Dec 14","days":4,"reason":"Làm thủ tục giấy tờ","status":"Đã duyệt"},{"code":"NP-1025","name":"Nguyễn Văn Hà","dept":"Nhân sự","type":"Nghỉ thai sản","from":"Dec 13","to":"Dec 13","days":1,"reason":"Việc gia đình","status":"Đã duyệt"},{"code":"NP-1026","name":"Hồ Hoài Hải","dept":"Kế toán","type":"Nghỉ phép năm","from":"Dec 15","to":"Dec 16","days":2,"reason":"Khám sức khỏe","status":"Từ chối"},{"code":"NP-1027","name":"Đỗ Minh Khoa","dept":"Hành chính","type":"Nghỉ ốm","from":"Dec 17","to":"Dec 19","days":3,"reason":"Về quê","status":"Đã hủy"},{"code":"NP-1028","name":"Bùi Đức Linh","dept":"Sản xuất","type":"Nghỉ không lương","from":"Dec 19","to":"Dec 22","days":4,"reason":"Đi du lịch","status":"Chờ duyệt"},{"code":"NP-1029","name":"Đặng Thu Hải","dept":"Mua hàng","type":"Nghỉ việc riêng","from":"Dec 21","to":"Dec 21","days":1,"reason":"Chăm con ốm","status":"Chờ duyệt"},{"code":"NP-1030","name":"Vũ Thị Khoa","dept":"Pháp chế","type":"Nghỉ thai sản","from":"Dec 23","to":"Dec 24","days":2,"reason":"Làm thủ tục giấy tờ","status":"Chờ duyệt"},{"code":"NP-1031","name":"Phan Ngọc Linh","dept":"Kho vận","type":"Nghỉ phép năm","from":"Dec 25","to":"Dec 27","days":3,"reason":"Việc gia đình","status":"Đã duyệt"},{"code":"NP-1032","name":"Huỳnh Quốc Mai","dept":"Chăm sóc khách hàng","type":"Nghỉ ốm","from":"Dec 27","to":"Dec 30","days":4,"reason":"Khám sức khỏe","status":"Đã duyệt"},{"code":"NP-1033","name":"Hoàng Văn Phúc","dept":"Vận hành","type":"Nghỉ không lương","from":"Dec 29","to":"Dec 29","days":1,"reason":"Về quê","status":"Đã duyệt"},{"code":"NP-1034","name":"Phạm Hoài Quân","dept":"Kỹ thuật","type":"Nghỉ việc riêng","from":"Dec 31","to":"Jan 1","days":2,"reason":"Đi du lịch","status":"Từ chối"},{"code":"NP-1035","name":"Lê Minh Thảo","dept":"Marketing","type":"Nghỉ thai sản","from":"Jan 2","to":"Jan 4","days":3,"reason":"Chăm con ốm","status":"Đã hủy"},{"code":"NP-1036","name":"Trần Đức Nam","dept":"Kinh doanh","type":"Nghỉ phép năm","from":"Jan 4","to":"Jan 7","days":4,"reason":"Làm thủ tục giấy tờ","status":"Chờ duyệt"}];
const STEP = 12;
const TONE = { 'Chờ duyệt': 'info', 'Đã duyệt': 'success', 'Từ chối': 'danger', 'Đã hủy': 'neutral' };
const TABS = ['Chờ duyệt', 'Đã duyệt', 'Từ chối', 'Đã hủy'];
const MON = { Jan: ['2027', '01'], Oct: ['2026', '10'], Nov: ['2026', '11'], Dec: ['2026', '12'] };
const { $, esc, fold } = EA;
const vn = (s) => { const [m, d] = s.split(' '); return String(d).padStart(2, '0') + '/' + MON[m][1] + '/' + MON[m][0]; };
const key = (s) => { const [m, d] = s.split(' '); return MON[m][0] + MON[m][1] + String(d).padStart(2, '0'); };
let shown = STEP, status = '', ready = false, mode = EA.state();
function list() {
  const q = fold($('q').value.trim());
  const rows = DATA.filter((r) => (!q || fold(r.name).includes(q)) && (!status || r.status === status));
  // Pending first (earliest start first: it needs a decision soonest), then the rest newest first.
  return rows.sort((a, b) => (a.status === 'Chờ duyệt') !== (b.status === 'Chờ duyệt') ? (a.status === 'Chờ duyệt' ? -1 : 1) : a.status === 'Chờ duyệt' ? key(a.from).localeCompare(key(b.from)) : key(b.from).localeCompare(key(a.from)));
}
function clearAll() { $('q').value = ''; status = ''; shown = STEP; render(); }
function showState(kind) {
  const el = $('empty'); el.hidden = false; $('rows').innerHTML = '';
  if (kind === 'error') { el.setAttribute('role', 'alert'); el.innerHTML = '<strong>Không tải được đơn nghỉ phép.</strong>Kiểm tra kết nối rồi thử lại.<br><button type="button" class="btn secondary" id="retry">Thử lại</button>'; $('retry').onclick = () => { location.search = ''; }; }
  else if (kind === 'first') { el.removeAttribute('role'); el.innerHTML = '<strong>Chưa có đơn nghỉ nào.</strong>Đơn nghỉ của nhân viên sẽ hiển thị ở đây để bạn duyệt.<br><button type="button" class="btn">Tạo đơn nghỉ</button>'; }
  else { el.removeAttribute('role'); el.innerHTML = '<strong>Không có đơn nghỉ nào khớp bộ lọc.</strong>Thử từ khóa khác hoặc bỏ bộ lọc.<br><button type="button" class="btn secondary" id="reset">Xóa bộ lọc</button>'; $('reset').onclick = clearAll; }
}
function renderTabs() {
  const src = mode === 'empty' ? [] : DATA;
  const t = (label, s, n) => '<button type="button" aria-pressed="' + (status === s) + '" data-s="' + s + '">' + label + '<span class="n">' + n + '</span></button>';
  $('tabs').innerHTML = t('Tất cả', '', src.length) + TABS.map((s) => t(s, s, src.filter((r) => r.status === s).length)).join('');
  const c = [];
  if ($('q').value.trim()) c.push(['q', 'Tên: ' + $('q').value.trim()]);
  if (status) c.push(['s', 'Trạng thái: ' + status]);
  $('fchips').hidden = !c.length;
  $('fchips').innerHTML = c.map(([k, x]) => '<span class="chip">' + esc(x) + '<button type="button" data-k="' + k + '" aria-label="Bỏ bộ lọc ' + esc(x) + '">×</button></span>').join('') + (c.length ? '<button type="button" class="link-btn" id="clear">Xóa tất cả</button>' : '');
}
function render() {
  const tbl = document.querySelector('table');
  if (mode === 'loading' || !ready) { tbl.setAttribute('aria-busy', 'true'); renderTabs(); EA.skeleton($('rows'), 9, 10); $('empty').hidden = true; $('more').hidden = true; $('range').textContent = ''; return; }
  tbl.setAttribute('aria-busy', 'false');
  if (mode === 'error') { $('tabs').innerHTML = ''; $('fchips').hidden = true; showState('error'); $('more').hidden = true; $('range').textContent = ''; return; }
  renderTabs();
  const src = mode === 'empty' ? [] : DATA;
  const pend = src.filter((r) => r.status === 'Chờ duyệt').length;
  $('summary').textContent = src.length ? src.length + ' đơn · ' + pend + ' chờ duyệt · ' + src.reduce((a, r) => a + r.days, 0) + ' ngày nghỉ' : 'Chưa có đơn nghỉ.';
  const all = mode === 'empty' ? [] : list(), rows = all.slice(0, shown);
  $('rows').innerHTML = rows.map((r) => '<tr data-code="' + r.code + '"><td>' + r.code + '</td><td>' + esc(r.name) + '</td><td>' + r.type + '</td><td class="muted">' + esc(r.reason) + '</td><td>' + vn(r.from) + '</td><td>' + vn(r.to) + '</td><td class="num">' + r.days + '</td><td><span class="badge tone-' + TONE[r.status] + '">' + r.status + '</span></td><td class="act">' + (r.status === 'Chờ duyệt' ? '<button type="button" class="btn sm ok" data-action="approve" aria-label="Duyệt đơn ' + r.code + '">Duyệt</button><button type="button" class="btn sm secondary no" data-action="reject" aria-label="Từ chối đơn ' + r.code + '">Từ chối</button>' : '') + '</td></tr>').join('');
  if (rows.length) $('empty').hidden = true; else showState(mode === 'empty' ? 'first' : 'none');
  $('more').hidden = shown >= all.length;
  $('range').textContent = all.length ? 'Hiển thị ' + rows.length + ' trên ' + all.length + ' đơn' : '';
}
$('more').addEventListener('click', () => { shown += STEP; render(); });
$('q').addEventListener('input', () => { shown = STEP; render(); });
$('tabs').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (!b) return; status = b.dataset.s; shown = STEP; render(); });
$('fchips').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (!b) return; if (b.id === 'clear') return clearAll(); if (b.dataset.k === 'q') $('q').value = ''; else status = ''; shown = STEP; render(); });
$('rows').addEventListener('click', async (ev) => {
  const b = ev.target.closest('button[data-action]'); if (!b) return;
  const r = DATA.find((x) => x.code === b.closest('tr').dataset.code);
  if (b.dataset.action === 'approve') { r.status = 'Đã duyệt'; render(); EA.toast('Đã duyệt đơn ' + r.code + ' của ' + r.name); return; }
  const reason = await EA.confirmDialog({ title: 'Từ chối đơn ' + r.code + '?', body: 'Đơn nghỉ ' + r.days + ' ngày (' + vn(r.from) + ' – ' + vn(r.to) + ') của ' + r.name + ' sẽ chuyển sang Từ chối. Nhập lý do để nhân viên biết.', confirmLabel: 'Từ chối đơn', danger: true, reason: true });
  if (!reason) { b.focus(); return; }
  r.status = 'Từ chối'; r.rejectReason = reason; render(); EA.toast('Đã từ chối đơn ' + r.code + ' của ' + r.name);
});
render();
if (mode !== 'loading') setTimeout(() => { ready = true; render(); }, mode ? 0 : 400);
</script>
