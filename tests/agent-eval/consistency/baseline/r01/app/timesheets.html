const TONE = { 'Đúng giờ': 'success', 'Đi muộn': 'warning', 'Vắng': 'danger', 'Nghỉ phép': 'info', 'Làm thêm': 'info', 'Chờ duyệt': 'info', 'Đã duyệt': 'success' };
const { $, esc, fold, isoToVN } = EA;
let page = 1, applied = { from: '', to: '', dept: '' }, ready = false, mode = EA.state();
const hrs = (s) => parseFloat(String(s).replace(',', '.')) || 0;
function list() {
  const q = fold($('q').value.trim());
  return DATA.filter((r) => (!q || fold(r.name).includes(q)) && (!applied.dept || r.dept === applied.dept) && (!applied.from || r.date >= applied.from) && (!applied.to || r.date <= applied.to))
    .sort((a, b) => b.date.localeCompare(a.date));
}
function clearAll() { $('q').value = ''; $('from').value = $('to').value = $('dept').value = ''; applied = { from: '', to: '', dept: '' }; page = 1; render(); }
function showState(kind) {
  const el = $('empty'); el.hidden = false; $('rows').innerHTML = '';
  if (kind === 'error') { el.setAttribute('role', 'alert'); el.innerHTML = '<strong>Không tải được bản ghi chấm công.</strong>Kiểm tra kết nối rồi thử lại.<br><button type="button" class="btn secondary" id="retry">Thử lại</button>'; $('retry').onclick = () => { location.search = ''; }; }
  else if (kind === 'first') { el.removeAttribute('role'); el.innerHTML = '<strong>Chưa có bản ghi chấm công.</strong>Bản ghi xuất hiện khi nhân viên chấm công.<br><button type="button" class="btn secondary" id="reload">Làm mới</button>'; $('reload').onclick = () => { location.search = ''; }; }
  else { el.removeAttribute('role'); el.innerHTML = '<strong>Không có bản ghi nào khớp bộ lọc.</strong>Thử từ khóa hoặc khoảng ngày khác.<br><button type="button" class="btn secondary" id="reset">Xóa bộ lọc</button>'; $('reset').onclick = clearAll; }
}
function renderChips() {
  const c = [];
  if ($('q').value.trim()) c.push(['q', 'Tên: ' + $('q').value.trim()]);
  if (applied.from) c.push(['from', 'Từ ' + isoToVN(applied.from)]);
  if (applied.to) c.push(['to', 'Đến ' + isoToVN(applied.to)]);
  if (applied.dept) c.push(['dept', 'Phòng ban: ' + applied.dept]);
  $('chips').hidden = !c.length;
  $('chips').innerHTML = c.map(([k, t]) => '<span class="chip">' + esc(t) + '<button type="button" data-k="' + k + '" aria-label="Bỏ bộ lọc ' + esc(t) + '">×</button></span>').join('') + (c.length ? '<button type="button" class="link-btn" id="clear">Xóa tất cả</button>' : '');
}
function render() {
  renderChips();
  const tbl = document.querySelector('table');
  $('prev').disabled = true; $('next').disabled = true;
  $('export').textContent = 'Xuất CSV (' + (mode === 'empty' || !ready || mode === 'error' ? 0 : list().length) + ' bản ghi)';
  if (mode === 'loading' || !ready) { tbl.setAttribute('aria-busy', 'true'); EA.skeleton($('rows'), 8, 10); $('empty').hidden = true; $('summary').textContent = ''; $('range').textContent = ''; return; }
  tbl.setAttribute('aria-busy', 'false');
  if (mode === 'error') { showState('error'); $('summary').textContent = ''; $('range').textContent = ''; return; }
  const all = mode === 'empty' ? [] : list(), size = +$('size').value, pages = Math.max(1, Math.ceil(all.length / size));
  if (page > pages) page = pages;
  const rows = all.slice((page - 1) * size, page * size);
  $('rows').innerHTML = rows.map((r) => '<tr><td>' + isoToVN(r.date) + '</td><td>' + esc(r.name) + '</td><td>' + r.dept + '</td><td class="num">' + r.cin + '</td><td class="num">' + r.cout + '</td><td class="num">' + r.hours + '</td><td><span class="badge tone-' + TONE[r.status] + '">' + r.status + '</span></td><td><span class="badge tone-' + TONE[r.approval] + '">' + r.approval + '</span></td></tr>').join('');
  if (rows.length) $('empty').hidden = true; else showState(mode === 'empty' ? 'first' : 'none');
  const n = (s) => all.filter((r) => r.status === s).length;
  $('summary').textContent = all.length ? all.length + ' bản ghi · ' + n('Đúng giờ') + ' đúng giờ · ' + n('Đi muộn') + ' đi muộn · ' + n('Vắng') + ' vắng · ' + n('Nghỉ phép') + ' nghỉ phép · ' + n('Làm thêm') + ' làm thêm · ' + all.filter((r) => r.approval === 'Chờ duyệt').length + ' chờ duyệt · tổng ' + EA.nf.format(Math.round(all.reduce((a, r) => a + hrs(r.hours), 0))) + ' giờ' : '';
  $('range').textContent = all.length ? 'Hiển thị ' + ((page - 1) * size + 1) + '–' + Math.min(page * size, all.length) + ' trên ' + all.length : '';
  $('prev').disabled = page <= 1;
  $('next').disabled = page >= pages || !all.length;
}
$('prev').addEventListener('click', () => { page--; render(); });
$('next').addEventListener('click', () => { page++; render(); });
$('size').addEventListener('change', () => { page = 1; render(); });
$('q').addEventListener('input', () => { page = 1; render(); });
$('apply').addEventListener('click', () => { applied = { from: $('from').value, to: $('to').value, dept: $('dept').value }; page = 1; render(); });
$('chips').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.id === 'clear') return clearAll();
  if (b.dataset.k === 'q') $('q').value = ''; else { applied[b.dataset.k] = ''; $(b.dataset.k).value = ''; }
  page = 1; render();
});
$('export').addEventListener('click', () => {
  const all = list(), q = (v) => '"' + String(v).replace(/"/g, '""') + '"';
  const csv = '﻿' + ['Ngày,Nhân viên,Phòng ban,Giờ vào,Giờ ra,Số giờ,Trạng thái,Duyệt công'].concat(all.map((r) => [isoToVN(r.date), r.name, r.dept, r.cin, r.cout, r.hours, r.status, r.approval].map(q).join(','))).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'cham-cong-2026-11.csv'; a.click();
  EA.toast('Đã xuất ' + all.length + ' bản ghi chấm công');
});
render();
if (mode !== 'loading') setTimeout(() => { ready = true; render(); }, mode ? 0 : 400);
