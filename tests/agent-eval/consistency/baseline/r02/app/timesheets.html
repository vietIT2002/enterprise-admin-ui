<body>
<aside class="sidebar">
  <div class="logo">ChấmCông Pro</div>
  <nav aria-label="Điều hướng chính">
    <p class="group">Nhân sự</p>
    <a href="employees.html">Nhân viên</a>
    <p class="group">Chấm công</p>

<main>
<header class="page-head">
  <h1>Bảng chấm công</h1>
  <div class="actions"><button class="btn primary" type="button" id="export">Xuất Excel</button></div>
</header>

<div class="toolbar">
  <input type="search" id="q" placeholder="Tìm theo tên nhân viên" aria-label="Tìm theo tên">
  <select id="st" aria-label="Trạng thái chấm công"><option value="">Mọi trạng thái</option><option>Đúng giờ</option><option>Đi muộn</option><option>Vắng</option><option>Nghỉ phép</option><option>Làm thêm</option></select>
  <select id="ap" aria-label="Duyệt công"><option value="">Mọi trạng thái duyệt</option><option>Chờ duyệt</option><option>Đã duyệt</option></select>
  <button type="button" class="btn filter-toggle" aria-expanded="false" aria-controls="panel">Thêm bộ lọc</button>
  <div class="chips" id="chips"></div>
</div>
<div class="more-panel" id="panel" hidden>
  <label>Từ ngày<input type="date" id="from" min="2026-11-02" max="2026-11-13"></label>
  <label>Đến ngày<input type="date" id="to" min="2026-11-02" max="2026-11-13"></label>
  <label>Phòng ban<select id="dept"><option value="">Tất cả</option><option>Kế toán</option><option>Nhân sự</option><option>Kinh doanh</option><option>Marketing</option><option>Kỹ thuật</option><option>Vận hành</option><option>Chăm sóc khách hàng</option><option>Kho vận</option><option>Pháp chế</option><option>Mua hàng</option><option>Sản xuất</option><option>Hành chính</option></select></label>
  <button type="button" class="btn" id="apply">Áp dụng</button>
</div>
<p class="summary" id="summary" aria-live="polite"></p>

<section aria-label="Bản ghi chấm công">
  <div data-state="ready" hidden>
    <div class="table-wrap">
      <table data-total-rows="120">
        <caption class="sr-only">Bản ghi chấm công</caption>
        <thead><tr><th scope="col">Ngày</th><th scope="col">Nhân viên</th><th scope="col">Phòng ban</th><th scope="col" class="num">Giờ vào</th><th scope="col" class="num">Giờ ra</th><th scope="col" class="num">Số giờ</th><th scope="col">Trạng thái</th><th scope="col">Duyệt công</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="pager">
      <label for="size">Số dòng mỗi trang</label>
      <select id="size"><option>10</option><option selected>20</option><option>50</option></select>
      <span id="range" class="tnum"></span>
      <button type="button" class="icon-btn prev" id="prev" aria-label="Trang trước">‹</button>
      <button type="button" class="icon-btn next" id="next" aria-label="Trang sau">›</button>
    </div>
  </div>
  <div data-state="empty" class="state-box" hidden>
    <p class="t" id="empty-title"></p><p class="d" id="empty-text"></p>
    <button type="button" class="btn" id="empty-action"></button>
  </div>
  <div data-state="loading" class="skel" aria-busy="true" aria-label="Đang tải bản ghi chấm công" id="skel" hidden></div>
  <div data-state="error" class="state-error" role="alert" hidden>
    <p class="t">Không tải được bản ghi chấm công.</p><p>Kiểm tra kết nối rồi thử lại.</p>
    <button type="button" class="btn" data-retry>Thử lại</button>
  </div>
</section>
</main>
<div id="toast" role="status" aria-live="polite"></div>

let REC = DATA;
let page = 1, applied = { from: '', to: '', dept: '' };
const ui = { q: '', st: '', ap: '' };
const hrs = (r) => parseFloat(String(r.hours).replace(',', '.')) || 0;
function list() {
  const q = norm(ui.q.trim());
  return REC.filter((r) => (!q || norm(r.name).includes(q)) && (!ui.st || r.status === ui.st) && (!ui.ap || r.approval === ui.ap) && (!applied.dept || r.dept === applied.dept) && (!applied.from || r.date >= applied.from) && (!applied.to || r.date <= applied.to))
    .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
}
function renderChips() {
  const c = [];
  if (ui.q) c.push(['q', 'Tên: ' + ui.q]);
  if (ui.st) c.push(['st', 'Trạng thái: ' + ui.st]);
  if (ui.ap) c.push(['ap', 'Duyệt công: ' + ui.ap]);
  if (applied.from) c.push(['from', 'Từ ngày: ' + fmtDate(applied.from)]);
  if (applied.to) c.push(['to', 'Đến ngày: ' + fmtDate(applied.to)]);
  if (applied.dept) c.push(['dept', 'Phòng ban: ' + applied.dept]);
  $('chips').innerHTML = c.map(([k, t]) => '<span class="chip">' + esc(t) + '<button type="button" data-chip="' + k + '" aria-label="Bỏ bộ lọc ' + esc(t) + '">×</button></span>').join('') + (c.length ? '<button type="button" class="link-btn" id="clear-all">Xóa tất cả</button>' : '');
}
function render() {
  renderChips();
  const all = list(), size = +$('size').value, pages = Math.max(1, Math.ceil(all.length / size));
  if (page > pages) page = pages;
  const n = (s) => all.filter((r) => r.status === s).length;
  $('export').textContent = 'Xuất ' + fmtN(all.length) + ' bản ghi ra Excel';
  $('summary').textContent = fmtN(all.length) + ' bản ghi · ' + fmtN(all.reduce((s, r) => s + hrs(r), 0), 1) + ' giờ làm · Đúng giờ ' + n('Đúng giờ') + ' · Đi muộn ' + n('Đi muộn') + ' · Vắng ' + n('Vắng') + ' · Nghỉ phép ' + n('Nghỉ phép') + ' · Làm thêm ' + n('Làm thêm') + ' · Chờ duyệt ' + all.filter((r) => r.approval === 'Chờ duyệt').length;
  if (!all.length) {
    const first = REC.length === 0;
    $('empty-title').textContent = first ? 'Chưa có bản ghi chấm công' : 'Không có bản ghi nào khớp bộ lọc';
    $('empty-text').textContent = first ? 'Bản ghi chấm công sẽ hiển thị ở đây khi nhân viên chấm công.' : 'Thử từ khóa khác hoặc xóa bộ lọc.';
    $('empty-action').textContent = first ? 'Tải lại' : 'Xóa bộ lọc';
    $('empty-action').hidden = false;
    showState('empty'); return;
  }
  showState('ready');
  const rows = all.slice((page - 1) * size, page * size);
  $('rows').innerHTML = rows.map((r) => '<tr><td class="tnum">' + fmtDate(r.date) + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.dept) + '</td><td class="num">' + esc(r.cin === '–' ? '—' : r.cin) + '</td><td class="num">' + esc(r.cout === '–' ? '—' : r.cout) + '</td><td class="num">' + esc(r.hours) + '</td><td>' + badge(r.status) + '</td><td>' + badge(r.approval) + '</td></tr>').join('');
  $('range').textContent = ((page - 1) * size + 1) + '–' + Math.min(page * size, all.length) + ' / ' + all.length + ' bản ghi';
  $('prev').disabled = page <= 1;
  $('next').disabled = page >= pages;
}
function clearAll() {
  ui.q = ui.st = ui.ap = ''; applied = { from: '', to: '', dept: '' };
  for (const id of ['q', 'st', 'ap', 'from', 'to', 'dept']) $(id).value = '';
  page = 1; render();
}
$('prev').addEventListener('click', () => { page--; render(); });
$('next').addEventListener('click', () => { page++; render(); });
$('size').addEventListener('change', () => { page = 1; render(); });
let t;
$('q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { ui.q = $('q').value; page = 1; render(); }, 200); });
$('st').addEventListener('change', () => { ui.st = $('st').value; page = 1; render(); });
$('ap').addEventListener('change', () => { ui.ap = $('ap').value; page = 1; render(); });
document.querySelector('.filter-toggle').addEventListener('click', function () { const p = $('panel'); p.hidden = !p.hidden; this.setAttribute('aria-expanded', String(!p.hidden)); });
$('apply').addEventListener('click', () => { applied = { from: $('from').value, to: $('to').value, dept: $('dept').value }; page = 1; render(); });
$('chips').addEventListener('click', (e) => {
  const c = e.target.closest('[data-chip]');
  if (c) { const k = c.dataset.chip; if (k in ui) ui[k] = ''; else applied[k] = ''; $(k).value = ''; page = 1; render(); }
  if (e.target.id === 'clear-all') clearAll();
});
$('empty-action').addEventListener('click', () => (REC.length ? clearAll() : (location.search = '')));
$('export').addEventListener('click', () => toast('Đã yêu cầu xuất ' + fmtN(list().length) + ' bản ghi chấm công ra Excel.'));
skeleton($('skel'), 10);
boot(render, () => { REC = []; });
</script>
