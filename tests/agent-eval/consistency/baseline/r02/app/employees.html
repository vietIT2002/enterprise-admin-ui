<div class="toolbar">

  <select id="dept" aria-label="Phòng ban"><option value="">Tất cả phòng ban</option><option>Kế toán</option><option>Nhân sự</option><option>Kinh doanh</option><option>Marketing</option><option>Kỹ thuật</option><option>Vận hành</option><option>Chăm sóc khách hàng</option><option>Kho vận</option><option>Pháp chế</option><option>Mua hàng</option><option>Sản xuất</option><option>Hành chính</option></select>
  <select id="st" aria-label="Trạng thái"><option value="">Mọi trạng thái</option><option>Đang làm</option><option>Thử việc</option><option>Nghỉ phép</option><option>Nghỉ thai sản</option><option>Tạm hoãn</option><option>Đã nghỉ</option></select>
  <div class="chips" id="chips"></div>
</div>
<p class="summary" id="summary" aria-live="polite"></p>

<section aria-label="Danh sách nhân viên">
  <div data-state="ready" hidden>
    <div class="table-wrap">
      <table data-total-rows="48">
        <caption class="sr-only">Danh sách nhân viên</caption>
        <thead><tr><th scope="col">Mã</th><th scope="col">Nhân viên</th><th scope="col">Email</th><th scope="col">Phòng ban</th><th scope="col">Chức vụ</th><th scope="col">Ngày vào làm</th><th scope="col">Trạng thái</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="pager" id="pager">
      <label for="size">Số dòng mỗi trang</label>
      <select id="size"><option>10</option><option>20</option><option>50</option></select>
      <span id="range" class="tnum"></span>
      <div class="nums" id="nums"></div>
    </div>
  </div>
  <div data-state="empty" class="state-box" id="empty" hidden>
    <p class="t" id="empty-title"></p><p class="d" id="empty-text"></p>
    <button type="button" class="btn" id="empty-action"></button>
  </div>
  <div data-state="loading" class="skel" aria-busy="true" aria-label="Đang tải danh sách nhân viên" id="skel" hidden></div>
  <div data-state="error" class="state-error" role="alert" hidden>
    <p class="t">Không tải được danh sách nhân viên.</p><p>Kiểm tra kết nối rồi thử lại.</p>
    <button type="button" class="btn" data-retry>Thử lại</button>
  </div>
</section>
</main>

let EMP = DATA;
let page = 1, size = 10;
const qs = new URLSearchParams(location.search);
const ui = { q: qs.get('q') || '', dept: qs.get('dept') || '', st: qs.get('st') || '' };
const byJoinDesc = (a, b) => (a.join < b.join ? 1 : a.join > b.join ? -1 : 0);
function list() {
  const q = norm(ui.q.trim());
  return EMP.filter((e) => (!q || norm(e.name).includes(q) || norm(e.id).includes(q) || e.email.includes(q)) && (!ui.dept || e.dept === ui.dept) && (!ui.st || e.status === ui.st)).sort(byJoinDesc);
}
function syncUrl() {
  const p = new URLSearchParams();
  for (const k of ['q', 'dept', 'st']) if (ui[k]) p.set(k, ui[k]);
  if (FORCED) p.set('state', FORCED);
  history.replaceState(null, '', p.toString() ? '?' + p : location.pathname);
}
function renderChips() {
  const c = [];
  if (ui.q) c.push(['q', 'Từ khóa: ' + ui.q]);
  if (ui.dept) c.push(['dept', 'Phòng ban: ' + ui.dept]);
  if (ui.st) c.push(['st', 'Trạng thái: ' + ui.st]);
  $('chips').innerHTML = c.map(([k, t]) => '<span class="chip">' + esc(t) + '<button type="button" data-chip="' + k + '" aria-label="Bỏ bộ lọc ' + esc(t) + '">×</button></span>').join('') + (c.length ? '<button type="button" class="link-btn" id="clear-all">Xóa tất cả</button>' : '');
}
function render() {
  syncUrl(); renderChips();
  const all = list(), pages = Math.max(1, Math.ceil(all.length / size));
  if (page > pages) page = pages;
  const cnt = (s) => all.filter((e) => e.status === s).length;
  $('summary').textContent = all.length ? fmtN(all.length) + ' nhân viên · Đang làm ' + cnt('Đang làm') + ' · Thử việc ' + cnt('Thử việc') + ' · Nghỉ phép ' + cnt('Nghỉ phép') + ' · Nghỉ thai sản ' + cnt('Nghỉ thai sản') + ' · Tạm hoãn ' + cnt('Tạm hoãn') + ' · Đã nghỉ ' + cnt('Đã nghỉ') : '0 nhân viên';
  if (!all.length) {
    const first = EMP.length === 0;
    $('empty-title').textContent = first ? 'Chưa có nhân viên' : 'Không có nhân viên nào khớp bộ lọc';
    $('empty-text').textContent = first ? 'Nhân viên được thêm vào sẽ hiển thị ở đây.' : 'Thử từ khóa khác hoặc xóa bộ lọc.';
    $('empty-action').textContent = first ? 'Thêm nhân viên' : 'Xóa bộ lọc';
    showState('empty'); return;
  }
  showState('ready');
  const rows = all.slice((page - 1) * size, page * size);
  $('rows').innerHTML = rows.map((e) => '<tr><td>' + esc(e.id) + '</td><td>' + esc(e.name) + '</td><td><a href="mailto:' + esc(e.email) + '">' + esc(e.email) + '</a></td><td>' + esc(e.dept) + '</td><td>' + esc(e.pos) + '</td><td class="tnum">' + fmtDate(e.join) + '</td><td>' + badge(e.status) + '</td></tr>').join('');
  $('range').textContent = ((page - 1) * size + 1) + '–' + Math.min(page * size, all.length) + ' / ' + all.length + ' nhân viên';
  let h = '';
  for (let i = 1; i <= pages; i++) h += '<button type="button" class="num" aria-label="Trang ' + i + '"' + (i === page ? ' aria-current="true"' : '') + '>' + i + '</button>';
  $('nums').innerHTML = h;
}
function clearAll() { ui.q = ui.dept = ui.st = ''; $('q').value = ''; $('dept').value = ''; $('st').value = ''; page = 1; render(); }
$('nums').addEventListener('click', (ev) => { const b = ev.target.closest('button.num'); if (b) { page = +b.textContent; render(); } });
$('size').addEventListener('change', () => { size = +$('size').value; page = 1; render(); });
let t;
$('q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { ui.q = $('q').value; page = 1; render(); }, 200); });
$('dept').addEventListener('change', () => { ui.dept = $('dept').value; page = 1; render(); });
$('st').addEventListener('change', () => { ui.st = $('st').value; page = 1; render(); });
$('chips').addEventListener('click', (e) => {
  const c = e.target.closest('[data-chip]');
  if (c) { ui[c.dataset.chip] = ''; $(c.dataset.chip).value = ''; page = 1; render(); }
  if (e.target.id === 'clear-all') clearAll();
});
$('empty-action').addEventListener('click', () => (EMP.length ? clearAll() : $('add').click()));
$('add').addEventListener('click', () => toast('Biểu mẫu thêm nhân viên chưa được kết nối.'));
$('q').value = ui.q; $('dept').value = ui.dept; $('st').value = ui.st;
skeleton($('skel'), 10);
boot(render, () => { EMP = []; });
</script>
