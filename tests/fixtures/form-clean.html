<!doctype html>
<html lang="vi-VN">
<head>
<meta charset="utf-8">
<!-- A long create form that follows the skill: labels above fields, typed inputs, a contact link and a sticky
     action bar that sticks because the page itself scrolls. The audit must find nothing. -->
<meta name="audit-page-type" content="form">
<meta name="audit-expect" content="">
<title>Tạo khách hàng</title>
<style>
  [hidden] { display: none !important; }
  html { font: 14px/20px system-ui, sans-serif; color: #0f172a; background: #fff; }
  body { margin: 0; }
  main { padding: 16px 24px 0; max-width: 720px; }
  h1 { font-size: 20px; line-height: 28px; font-weight: 600; margin: 0 0 16px; }
  h2 { font-size: 16px; line-height: 24px; font-weight: 600; margin: 24px 0 12px; }
  button, input, select, textarea { font: inherit; }
  label { display: block; font-weight: 500; margin-bottom: 4px; }
  .field { margin-bottom: 16px; }
  .help { color: #475569; margin: 4px 0 0; }
  input, select { height: 32px; padding: 0 8px; border: 1px solid #8592a6; border-radius: 4px; width: 360px; box-sizing: border-box; }
  input[type="date"] { width: 180px; }
  textarea { width: 100%; height: 120px; padding: 8px; border: 1px solid #8592a6; border-radius: 4px; box-sizing: border-box; }
  .btn { height: 32px; padding: 0 12px; border: 1px solid #cbd5e1; border-radius: 4px; background: #fff; color: #0f172a; }
  .primary { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
  .icon { width: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  .bar { position: sticky; bottom: 0; display: flex; justify-content: flex-end; gap: 8px; padding: 12px 0; border-top: 1px solid #e2e8f0; background: #fff; }
  .unsaved { color: #475569; margin-right: auto; align-self: center; }
  a { color: #1d4ed8; }
  .spacer { height: 900px; }
</style>
</head>
<body>
<main>
  <h1>Tạo khách hàng</h1>
  <form>
    <h2>Thông tin chung</h2>
    <div class="field"><label for="name">Tên khách hàng *</label><input id="name" name="name" required></div>
    <div class="field"><label for="tax">Mã số thuế</label><input id="tax" name="tax" inputmode="numeric"><p class="help">10 chữ số, hoặc 13 với chi nhánh.</p></div>
    <div class="field"><label for="since">Ngày bắt đầu hợp tác</label><input id="since" name="since" type="date"></div>
    <h2>Liên hệ</h2>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"></div>
    <div class="field"><label for="phone">Điện thoại</label><input id="phone" name="phone" type="tel" autocomplete="tel"></div>
    <p class="help">Cần hỗ trợ? Gửi thư tới <a href="mailto:hotro@minhphat.vn">hotro@minhphat.vn</a>.</p>
    <h2>Ghi chú</h2>
    <div class="field">
      <label for="note">Ghi chú nội bộ</label><textarea id="note" name="note"></textarea>
      <button class="btn icon" type="button" aria-label="Xoá ghi chú"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M6 4V2h4v2M5 4l1 10h4l1-10" fill="none" stroke="currentColor"></path></svg></button>
    </div>
    <div class="spacer"></div>
    <div class="bar">
      <span class="unsaved" role="status">Có thay đổi chưa lưu</span>
      <button class="btn" type="button">Huỷ</button>
      <button class="btn primary" type="submit">Lưu</button>
    </div>
    <div hidden role="alert">Có 3 lỗi cần sửa</div>
  </form>
</main>
</body>
</html>
